[metadata]
name = "sesh-sessions"
description = "Browse and switch sesh sessions"
requirements = ["sesh", "tmux"]

[source]
command = [
  "sesh list -i -d",
  "sesh list -t -i -d",
  "sesh list -c -i",
  "sesh list -z -i -d",
]
ansi = true
output = "{strip_ansi|split: :1..}"

[preview]
command = "sesh preview '{strip_ansi|split: :1..}'"

[keybindings]
enter = "actions:connect"
ctrl-d = "actions:kill"

[ui.preview_panel]
size = 55

[actions.connect]
description = "Connect to the selected session"
command = "sesh connect --switch '{strip_ansi|split: :1..}'"
mode = "execute"

[actions.kill]
description = "Kill the selected tmux session"
command = "tmux kill-session -t '{strip_ansi|split: :1..}' 2>/dev/null"
mode = "fork"
